# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   PHONIX_SSH_HOST, PHONIX_SSH_USER
#   va PHONIX_SSH_PRIVATE_KEY yoki PHONIX_SSH_PASSWORD
#
# Deploy faqat CI (testlar, TypeScript, build) MUVAFFAQIYATLI o'tgandan keyin ishga tushadi va
# aynan sinovdan o'tgan commit chiqariladi. Testlar yiqilsa — serverga hech narsa chiqmaydi.
# Qo'lda: Actions → Deploy to server → Run workflow (main dagi oxirgi commit; CI ni tekshirib bosing).

name: Deploy to server

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phonix-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # CI dan kelgan bo'lsa — faqat muvaffaqiyatli va main dagi push uchun (PR uchun emas)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH — pull, build, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PHONIX_SSH_HOST }}
          username: ${{ secrets.PHONIX_SSH_USER }}
          key: ${{ secrets.PHONIX_SSH_PRIVATE_KEY }}
          password: ${{ secrets.PHONIX_SSH_PASSWORD }}
          port: ${{ secrets.PHONIX_SSH_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            REF="${{ github.event.workflow_run.head_sha || github.sha }}"
            URL="https://raw.githubusercontent.com/riskgroup77/phoenix/${REF}/deploy_phonix.sh"
            # Avval serverdagi git (repo private bo'lsa ham ishlaydi), bo'lmasa — ochiq raw URL
            if [ -d /phonix/.git ] && git -C /phonix fetch -q origin main 2>/dev/null \
               && git -C /phonix show "${REF}:deploy_phonix.sh" > /tmp/phonix_deploy.sh 2>/dev/null \
               && [ -s /tmp/phonix_deploy.sh ]; then
              echo "deploy_phonix.sh git'dan olindi (${REF})"
            elif command -v curl >/dev/null 2>&1; then
              curl -fsSL -o /tmp/phonix_deploy.sh "$URL"
            else
              wget -qO /tmp/phonix_deploy.sh "$URL"
            fi
            chmod +x /tmp/phonix_deploy.sh
            export PHONIX_GIT_RESET=true
            export PHONIX_GIT_REF="${REF}"
            export PHONIX_FRONTEND_WEB_ROOT=/var/www/ilmiyfaoliyat
            bash /tmp/phonix_deploy.sh
