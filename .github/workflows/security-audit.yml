# Bog'liqliklar xavfsizlik auditi — har pushda emas (CI ni sekinlashtirardi), haftalik va qo'lda.
# Deployni to'smaydi; topilma bo'lsa workflow qizil bo'ladi (GitHub xabar yuboradi).

name: Security audit

on:
  schedule:
    - cron: '0 3 * * 1'   # har dushanba 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit
        run: |
          python -m pip install -q --upgrade pip pip-audit
          pip-audit -r requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit
        run: npm audit --audit-level=high --package-lock-only
