[pytest]
# Test sozlamalari: Redis/Celery/OpenSearch/to'lov kalitlarisiz (config/settings_test.py)
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py *_tests.py
# Faqat tests/ — backend ildizidagi test_*.py skriptlar haqiqiy Click API'ga murojaat qiladi
testpaths = tests
addopts = -q --tb=short
