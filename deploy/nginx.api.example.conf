# API — umumiy namuna. Production: infrastructure/nginx/phoenix-api-ilmiyfaoliyat.conf
# Upstream nomini serverda noyob qiling (masalan phoenix_upstream_ilmiyfaoliyat).
# gunicorn: 127.0.0.1:8050 — 8000 boshqa ilovalarda bo'lishi mumkin

upstream phoenix_api_example {
    server 127.0.0.1:8050;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 25m;

    location /health {
        proxy_pass http://phoenix_api_example;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Prometheus: faqat ichki tarmoq / VPN; ochiq internetga chiqarmang.
    # location /metrics {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://phoenix_api_example;
    #     proxy_set_header Host $host;
    #     access_log off;
    # }

    # OPTIONS preflight Django + django-cors-headers ga yetishi kerak (CORS sarlavhalari u yerda)
    location / {
        proxy_pass http://phoenix_api_example;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
