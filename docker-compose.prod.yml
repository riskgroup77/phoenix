# Phoenix — production (serverda: /home/phoenix). Lokal ishlab chiqish uchun: docker-compose.yml
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   yoki to'liq deploy:  bash deploy_docker.sh
#
# Barcha sozlamalar (maxfiy qiymatlar ham) — backend/.env da; bu faylga parol yozilmaydi.
# Tashqariga hech qaysi port ochilmaydi: web faqat 127.0.0.1:8050 da, uni host'dagi nginx proxy qiladi
# (infrastructure/nginx/*.conf). Frontend (frontend/dist) va media (backend/media) ni ham nginx beradi.

name: phoenix

x-app: &app
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  # Kod bind-mount qilinadi — media/staticfiles host'dagi root egaligidagi papkalarga yoziladi
  user: root
  volumes:
    - ./backend:/app
    # Local Bot API fayllari (getFile shu yo'lni qaytaradi) — web/celery/bot ham aynan shu yo'l bilan o'qiydi
    - ./backend/telegram-bot-api:/var/lib/telegram-bot-api
  env_file:
    - ./backend/.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings
    # Bot, bildirishnomalar va fayl ombori — hammasi local Bot API server orqali (fayl 2000 MB gacha)
    TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
    TG_BOT_API_URL: http://telegram-bot-api:8081
    TG_BOT_API_LOCAL: 'true'
    TG_BOT_API_DATA_DIR: /var/lib/telegram-bot-api
    TG_STORAGE_SPOOL_DIR: /app/tg-spool
    DB_HOST: db
    DB_PORT: '5432'
    REDIS_URL: redis://redis:6379/0
    USE_SQLITE: 'false'
    API_BASE_URL: http://web:8000/api/v1
    ANTIPLAG_OPENSEARCH_URL: http://opensearch:9200
    ANTIPLAG_OPENSEARCH_ENABLED: 'true'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Login/parol/baza nomi backend/.env dagi DB_USER / DB_PASSWORD / DB_NAME dan olinadi
    entrypoint:
      - sh
      - -c
      - export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_NAME"; exec docker-entrypoint.sh postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$DB_USER" -d "$$DB_NAME"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # Local Telegram Bot API: backend/.env da TELEGRAM_API_ID va TELEGRAM_API_HASH (https://my.telegram.org).
  # Django faylni `file:///app/media/...` deb beradi — media va spool shu yo'l bilan ulanadi (HTTP orqali yuklanmaydi).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TELEGRAM_LOCAL: '1'
    volumes:
      - ./backend/telegram-bot-api:/var/lib/telegram-bot-api
      - ./backend/media:/app/media:ro
      - ./backend/tg-spool:/app/tg-spool:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  web:
    <<: *app
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    ports:
      - '127.0.0.1:8050:8000'
    healthcheck:
      # X-Forwarded-Proto: aks holda SECURE_SSL_REDIRECT https ga yo'naltiradi va tekshiruv yiqiladi
      test: ['CMD', 'python', '-c', "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started

  celery:
    <<: *app
    command: celery -A config worker -l info --concurrency=2 --max-tasks-per-child=50
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started

  bot:
    <<: *app
    command: python bot/bot.py
    depends_on:
      - web
      - telegram-bot-api

volumes:
  pgdata:
  osdata:
