# Phoenix — production (serverda: /home/phoenix). Lokal ishlab chiqish uchun: docker-compose.yml
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   yoki to'liq deploy:  bash deploy_docker.sh
#
# Barcha sozlamalar (maxfiy qiymatlar ham) — backend/.env da; bu faylga parol yozilmaydi.
# Tashqariga hech qaysi port ochilmaydi: web faqat 127.0.0.1:8050 da, uni host'dagi nginx proxy qiladi
# (infrastructure/nginx/*.conf). Frontend (frontend/dist) va media (backend/media) ni ham nginx beradi.

name: phoenix

x-app: &app
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  # Kod bind-mount qilinadi — media/staticfiles host'dagi root egaligidagi papkalarga yoziladi
  user: root
  volumes:
    - ./backend:/app
  env_file:
    - ./backend/.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings
    DB_HOST: db
    DB_PORT: '5432'
    REDIS_URL: redis://redis:6379/0
    USE_SQLITE: 'false'
    API_BASE_URL: http://web:8000/api/v1
    ANTIPLAG_OPENSEARCH_URL: http://opensearch:9200
    ANTIPLAG_OPENSEARCH_ENABLED: 'true'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Login/parol/baza nomi backend/.env dagi DB_USER / DB_PASSWORD / DB_NAME dan olinadi
    entrypoint:
      - sh
      - -c
      - export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_NAME"; exec docker-entrypoint.sh postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$DB_USER" -d "$$DB_NAME"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  web:
    <<: *app
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    ports:
      - '127.0.0.1:8050:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  celery:
    <<: *app
    command: celery -A config worker -l info --concurrency=2 --max-tasks-per-child=50
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  bot:
    <<: *app
    command: python bot/bot.py
    depends_on:
      - web

volumes:
  pgdata:
  osdata:
