services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phoenix_scientific
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d phoenix_scientific']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: 'false'
      ANTIPLAG_OPENSEARCH_URL: http://opensearch:9200
      ANTIPLAG_OPENSEARCH_ENABLED: 'true'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: 'false'
      ANTIPLAG_OPENSEARCH_URL: http://opensearch:9200
      ANTIPLAG_OPENSEARCH_ENABLED: 'true'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    volumes:
      - osdata:/usr/share/opensearch/data

  # Telegram fayl ombori (apps/tgstorage) — faqat: docker compose --profile telegram up
  # backend/.env: TELEGRAM_API_ID, TELEGRAM_API_HASH, TG_STORAGE_BOT_TOKENS, TG_STORAGE_CHAT_ID,
  # TG_BOT_API_URL=http://telegram-bot-api:8081, TG_BOT_API_DATA_DIR=/app/telegram-bot-api,
  # TG_STORAGE_SPOOL_DIR=/app/tg-spool. Media/spool yo'llari web konteyneridagi bilan bir xil (/app/...).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ['telegram']
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: '1'
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - ./backend/telegram-bot-api:/var/lib/telegram-bot-api
      - ./backend/media:/app/media:ro
      - ./backend/tg-spool:/app/tg-spool:ro

volumes:
  pgdata:
  osdata:
