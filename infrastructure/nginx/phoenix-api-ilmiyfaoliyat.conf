# Phoenix API — api.ilmiyfaoliyat.uz
# Boshqa nginx saytlariga aralashmaslik uchun:
#   - upstream nomi noyob: phoenix_upstream_ilmiyfaoliyat
#   - faqat bu faylni sites-available ga qo'ying va symlink qiling
#
# Gunicorn loopback: 127.0.0.1:8050 (systemd: Environment=GUNICORN_BIND=127.0.0.1:8050)
# Agar 8050 band bo'lsa, boshqa bo'sh port tanlang va systemd + shu fayldagi server qatorini moslang.
#
# SSL: certbot --nginx -d api.ilmiyfaoliyat.uz  yoki mavjud sertifikat yo'li

upstream phoenix_upstream_ilmiyfaoliyat {
    server 127.0.0.1:8050;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ilmiyfaoliyat.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ilmiyfaoliyat.uz;

    # Certbot ba'zan api.ilmiyfaoliyat.uz-0001 papkasini yaratadi — nginx yo'llarini moslang:
    ssl_certificate     /etc/letsencrypt/live/api.ilmiyfaoliyat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ilmiyfaoliyat.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # Media fayllar (jurnal rasmlari, PDF va h.k.) — Django DEBUG=False da gunicorn bermaydi
    location /media/ {
        alias /phonix/backend/media/;
        expires 30d;
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    location /health {
        proxy_pass http://phoenix_upstream_ilmiyfaoliyat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # OPTIONS preflight Django + django-cors-headers ga yetishi kerak
    location / {
        proxy_pass http://phoenix_upstream_ilmiyfaoliyat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
