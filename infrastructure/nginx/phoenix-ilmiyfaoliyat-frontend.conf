# Phoenix frontend — ilmiyfaoliyat.uz (HTTPS)
# Faqat server_name bu domenlar — boshqa virtual hostlarga ta'sir qilmaydi.
# Serverda: sites-available/phoenix-ilmiyfaoliyat-frontend → sites-enabled (default.conf ga tegmang).
#
# Sertifikat: alohida papka — api.ilmiyfaoliyat.uz dan ajratilgan (SNI to'g'ri ishlashi uchun).
#   sudo certbot certonly --nginx -d ilmiyfaoliyat.uz -d www.ilmiyfaoliyat.uz
# yoki mavjud /etc/letsencrypt/live/ilmiyfaoliyat.uz/ yo'llarini tekshiring.
#
# MUHIM: Agar faqat HTTP bo'lsa yoki 443 da default_server boshqa sayt bo'lsa —
#        NET::ERR_CERT_* xatolari chiqadi. infrastructure/nginx/fix-https-ilmiyfaoliyat.sh

server {
    listen 80;
    listen [::]:80;
    server_name ilmiyfaoliyat.uz www.ilmiyfaoliyat.uz;
    return 301 https://$host$request_uri;
}

# Nginx 1.25.1+: http2 alohida (bir nechta server {} bir 443 uchun — "protocol options redefined" kamayadi)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ilmiyfaoliyat.uz www.ilmiyfaoliyat.uz;

    ssl_certificate /etc/letsencrypt/live/ilmiyfaoliyat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ilmiyfaoliyat.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Ixtiyoriy: OCSP stapling (chain mavjud bo'lsa)
    # ssl_trusted_certificate /etc/letsencrypt/live/ilmiyfaoliyat.uz/chain.pem;
    # ssl_stapling on; ssl_stapling_verify on; (resolver kerak)

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /phonix/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|mp4|webm|ogg|ogv|pdf|doc|docx)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
