# Phoenix frontend — ilmiyfaoliyat.uz (HTTPS)
# Faqat server_name bu domenlar — boshqa virtual hostlarga ta'sir qilmaydi.

server {
    listen 80;
    listen [::]:80;
    server_name ilmiyfaoliyat.uz www.ilmiyfaoliyat.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen 192.168.0.101:443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ilmiyfaoliyat.uz www.ilmiyfaoliyat.uz;

    ssl_certificate /etc/letsencrypt/live/ilmiyfaoliyat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ilmiyfaoliyat.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /phonix/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # SPA shell — brauzer cache qilmasin (eski JS/CSS havolalari muammosini oldini oladi)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|mp4|webm|ogg|ogv|pdf|doc|docx)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
