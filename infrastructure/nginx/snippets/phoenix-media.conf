# Phoenix — media fayllar himoyasi (api.ilmiyfaoliyat.uz server bloki ichiga include qilinadi).
#
# O'rnatish (bir marta): /etc/nginx/sites-available/phoenix-api-ilmiyfaoliyat.conf da eski
#     location /media/ { alias /phonix/backend/media/; ... }
# blokini o'chirib, o'rniga:
#     include /etc/nginx/snippets/phoenix-media.conf;
# so'ng:  sudo nginx -t && sudo systemctl reload nginx
# va backend/.env:  MEDIA_ACCEL_REDIRECT=true   (sudo systemctl restart phoenix-backend)
#
# Ochiq papkalar (jurnal rasmlari, muqovalar, avatarlar, nashr sertifikatlari) — to'g'ridan-to'g'ri.
# Qolgan barcha fayllar (qo'lyozmalar, cheklar, DOI/UDK/tarjima fayllari) — Django imzo/ruxsatni tekshiradi
# (config/media_protection.py), so'ng X-Accel-Redirect bilan shu yerdagi internal joydan beriladi.

location ~ ^/media/(journals|issues|avatars|articles/publication_certificates)/ {
    root /phonix/backend;
    expires 30d;
    add_header Access-Control-Allow-Origin *;
    access_log off;
}

location /media/ {
    proxy_pass http://phoenix_upstream_ilmiyfaoliyat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
}

location /_protected_media/ {
    internal;
    alias /phonix/backend/media/;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff;
}
