# Phoenix — media fayllar himoyasi (api.ilmiyfaoliyat.uz server bloki ichiga include qilinadi).
#
# O'rnatish (bir marta): /etc/nginx/sites-available/phoenix-api-ilmiyfaoliyat.conf da eski
#     location /media/ { alias /phonix/backend/media/; ... }
# blokini o'chirib, o'rniga:
#     include /etc/nginx/snippets/phoenix-media.conf;
# so'ng:  sudo nginx -t && sudo systemctl reload nginx
# va backend/.env:  MEDIA_ACCEL_REDIRECT=true   (sudo systemctl restart phoenix-backend)
#
# Ochiq papkalar (jurnal rasmlari, muqovalar, avatarlar, nashr sertifikatlari) — to'g'ridan-to'g'ri.
# Qolgan barcha fayllar (qo'lyozmalar, cheklar, DOI/UDK/tarjima fayllari) — Django imzo/ruxsatni tekshiradi
# (config/media_protection.py), so'ng X-Accel-Redirect bilan shu yerdagi internal joydan beriladi.

# HTML/SVG/JS kabi faol kontent api. domenida hech qachon sahifa sifatida ochilmasin (XSS: skript admin
# cookie'si bilan so'rov yuborardi) — faqat yuklab olish. Regex location'lar tartib bo'yicha tekshiriladi,
# shuning uchun bular ochiq papkalar blokidan OLDIN turishi shart.
location ~* ^/media/((?:journals|issues|avatars|articles/publication_certificates)/.+\.(?:html?|xhtml|shtml|svgz?|xml|xsl|m?js|swf))$ {
    root /phonix/backend;
    try_files $uri @phoenix_media_restore;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "sandbox" always;
}

location ~* ^/_protected_media/(.+\.(?:html?|xhtml|shtml|svgz?|xml|xsl|m?js|swf))$ {
    internal;
    alias /phonix/backend/media/$1;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "sandbox" always;
}

# Katta hujjat yuklash: antiplagiat tekshiruvi va kitob qo'lyozmasi 100 MB gacha (Django ham tekshiradi:
# config/upload_validation.py — oddiy jurnal maqolasi baribir 25 MB). Server bloki uchun umumiy chegara
# (client_max_body_size 25m) o'zgarmaydi — faqat maqola yaratish / fayl almashtirish / sahifa sanash manzillari.
# Regex qo'shtirnoqda: ichidagi {36} nginx uchun blok boshlanishi emas
location ~ "^/api/v1/articles/(page-count/|[0-9a-fA-F-]{36}/)?$" {
    client_max_body_size 100m;
    client_body_timeout 300s;
    proxy_pass http://phoenix_upstream_ilmiyfaoliyat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ~ ^/media/(journals|issues|avatars|articles/publication_certificates)/ {
    root /phonix/backend;
    # Diskdan o'chirilgan (Telegram'da saqlangan) fayl — Django qaytarib beradi (apps/tgstorage)
    try_files $uri @phoenix_media_restore;
    expires 30d;
    add_header Access-Control-Allow-Origin *;
    add_header X-Content-Type-Options nosniff;
    access_log off;
}

location /media/ {
    proxy_pass http://phoenix_upstream_ilmiyfaoliyat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
}

location @phoenix_media_restore {
    proxy_pass http://phoenix_upstream_ilmiyfaoliyat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
}

location /_protected_media/ {
    internal;
    alias /phonix/backend/media/;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff;
}
