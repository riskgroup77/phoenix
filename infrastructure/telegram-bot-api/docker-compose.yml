# Phoenix — local Telegram Bot API server (fayl ombori: apps/tgstorage). Fayl 2000 MB gacha.
#
# deploy_phonix.sh o'zi ishga tushiradi (backend/.env da TELEGRAM_API_ID va TELEGRAM_API_HASH bo'lsa). Qo'lda:
#   docker compose -p phoenix-tg -f infrastructure/telegram-bot-api/docker-compose.yml --env-file backend/.env up -d
#
# api_id / api_hash: https://my.telegram.org → API development tools.
# Media va spool papkalari konteynerga hostdagi AYNAN SHU YO'L bilan ulanadi: Django faylni `file:///yo'l`
# deb beradi va server uni o'zi o'qiydi (HTTP orqali yuklanmaydi — katta faylda RAM band bo'lmaydi).
# Port faqat 127.0.0.1 da — tashqaridan ochiq emas.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: phoenix-tg-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?backend/.env da TELEGRAM_API_ID yo'q}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?backend/.env da TELEGRAM_API_HASH yo'q}
      TELEGRAM_LOCAL: '1'
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - ${PHONIX_DIR:-/phonix}/telegram-bot-api:/var/lib/telegram-bot-api
      - ${PHONIX_DIR:-/phonix}/backend/media:${PHONIX_DIR:-/phonix}/backend/media:ro
      - ${PHONIX_DIR:-/phonix}/tg-spool:${PHONIX_DIR:-/phonix}/tg-spool:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
